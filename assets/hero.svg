<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Illustration: Claude Code subagents listed as named, live sessions in Herdr's side panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="1" stop-color="#0b1622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .s { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .pulse2 { animation: pulse 1.6s ease-in-out .5s infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>

  <!-- window -->
  <rect x="60" y="56" width="1080" height="448" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="60" y="56" width="1080" height="38" rx="14" fill="#161b22"/>
  <rect x="60" y="80" width="1080" height="14" fill="#161b22"/>
  <circle cx="86" cy="75" r="6" fill="#ff5f57"/>
  <circle cx="106" cy="75" r="6" fill="#febc2e"/>
  <circle cx="126" cy="75" r="6" fill="#28c840"/>
  <text x="600" y="80" text-anchor="middle" class="m" font-size="13" fill="#8b949e">herdr — workspace · tab "review-auth"</text>

  <!-- sidebar -->
  <rect x="60" y="94" width="300" height="410" fill="#11161d"/>
  <line x1="360" y1="94" x2="360" y2="504" stroke="#30363d"/>
  <text x="84" y="128" class="m" font-size="12" fill="#6e7681" letter-spacing="2">AGENTS</text>

  <g class="m" font-size="15">
    <rect x="72" y="144" width="276" height="40" rx="8" fill="#1f2630"/>
    <circle cx="94" cy="164" r="6" fill="#58a6ff" class="pulse" filter="url(#glow)"/>
    <text x="112" y="169" fill="#e6edf3">orchestrator</text>
    <text x="336" y="169" text-anchor="end" fill="#58a6ff" font-size="12">working</text>

    <circle cx="94" cy="212" r="6" fill="#58a6ff" class="pulse2" filter="url(#glow)"/>
    <text x="112" y="217" fill="#e6edf3">reviewer</text>
    <text x="336" y="217" text-anchor="end" fill="#58a6ff" font-size="12">working</text>

    <circle cx="94" cy="256" r="6" fill="#f0b72f" filter="url(#glow)"/>
    <text x="112" y="261" fill="#e6edf3">tester</text>
    <text x="336" y="261" text-anchor="end" fill="#f0b72f" font-size="12">needs you</text>

    <circle cx="94" cy="300" r="6" fill="#3fb950"/>
    <text x="112" y="305" fill="#e6edf3">docs</text>
    <text x="336" y="305" text-anchor="end" fill="#3fb950" font-size="12">done</text>
  </g>
  <text x="84" y="470" class="m" font-size="12" fill="#6e7681">4 agents · 1 tab · 0 invisible</text>

  <!-- main pane -->
  <g class="m" font-size="15">
    <text x="392" y="138" fill="#d97757">✻ reviewer</text>
    <text x="490" y="138" fill="#6e7681">· claude --name reviewer</text>
    <text x="392" y="178" fill="#8b949e">&gt; Review the diff on this branch. Report findings only.</text>
    <text x="392" y="218" fill="#e6edf3">● Reading src/auth/session.ts</text>
    <text x="392" y="246" fill="#e6edf3">● Reading src/auth/refresh.ts</text>
    <text x="392" y="274" fill="#e6edf3">● Found: refresh token is reused after rotation</text>
    <text x="410" y="302" fill="#6e7681">  └ src/auth/refresh.ts:88</text>
    <text x="392" y="342" fill="#3fb950">● SendMessage → orchestrator: 1 finding</text>
    <text x="392" y="390" fill="#e6edf3">$ herdr agent get tester</text>
    <text x="392" y="418" fill="#f0b72f">blocked — waiting for permission</text>
    <text x="392" y="458" fill="#e6edf3">$ </text>
    <rect x="412" y="445" width="9" height="17" fill="#e6edf3" class="cursor"/>
  </g>

  <!-- caption -->
  <text x="600" y="538" text-anchor="middle" class="s" font-size="15" fill="#8b949e">Every subagent is a real Claude session in its own pane. Watch it. Answer it. Stop it.</text>
</svg>
